# Shared documentation build-and-deploy logic used by both release-docs.yaml (stable
# releases, triggered by version tags) and release-docs-dev.yaml (dev docs, triggered
# on push to main). Keeping the steps in one place avoids the two drifting.

name: Documentation Publish
on:
  workflow_call:
    inputs:
      mode:
        description: "Which mike target to publish: 'stable' or 'dev'"
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to push to gh-pages branch
    # Only one deployment at a time: concurrent pushes to gh-pages are rejected.
    # Only the latest pending run is kept, GitHub cancels the older pending ones.
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      # Install dependencies including documentation tools
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          install-args: "--groups dev,docs"

      # Configure git and fetch gh-pages branch for mike
      - name: Setup doc deploy
        uses: ./.github/actions/setup-doc-deploy
        with:
          ci-bot-email: ${{ secrets.CI_BOT_EMAIL }}

      # Build and deploy documentation for the requested mode
      - name: Build and deploy documentation
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            stable) inv doc.publish-latest ;;
            dev) inv doc.publish-dev ;;
            *)
              echo "::error::Unknown mode '$MODE', expected 'stable' or 'dev'"
              exit 1
              ;;
          esac
