[build-system]
requires = ["hatchling>=1.33", "hatchling-autoextras-hook>=0.1.3"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests"]

[tool.hatch.metadata.hooks.autoextras]

[project]
name = "hya"
version = "0.5.0a0"
description = "A library of custom OmegaConf resolvers"
readme = "README.md"
authors = [{ name = "Thibaut Durand", email = "durand.tibo+gh@gmail.com" }]
keywords = ["omegaconf", "resolver", "hydra"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]

dynamic = ["maintainers"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

requires-python = ">=3.11"

dependencies = ["omegaconf>=2.2,<3.0"]

[project.optional-dependencies]
braceexpand = ["braceexpand>=0.1.7,<0.2.0"]
numpy = ["numpy>=2.0,<3.0"]
torch = [
  "torch>=2.4,<3.0; (sys_platform == 'linux' or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
]

# Testing: ``hya.testing`` (the pytest marks) imports pytest
testing = ["pytest>=9.0,<10.0"]

[dependency-groups]

dev = [
  "codespell>=2.4,<3.0",
  "coverage[toml]>=7.17.4,<8.0",
  "docformatter>=1.7.8,<2.0",
  "feu[all]>=0.9.0,<1.0",
  # grimp (import-linter) does not build on free-threaded Python 3.13.
  "import-linter>=2.0,<3.0; python_version >= '3.14'",
  "invoke-tasklib>=0.1.0,<1.0",
  "invoke>=3.0,<4.0",
  "pre-commit>=4.7,<5.0",
  "pygments>=2.21,<3.0",
  "pyright>=1.1.414,<2.0",
  "pytest-cov>=7.1,<8.0",
  "pytest-timeout>=2.4,<3.0",
  "pytest>=9.2,<10.0",
  "ruff>=0.17,<1.0",
  "ty>=0.0.112,<1.0",
  "xdoctest>=1.3,<2.0",
]

docs = [
  "griffe-inherited-docstrings >=1.1,<2.0",
  "mike >=2.2,<3.0",
  "mkdocs-material >=9.7,<10.0",
  "mkdocstrings[python]>=1.0.8,<2.0",
  "mkdocs-include-markdown-plugin >=7.3,<8.0",
]

[project.urls]
Homepage = "https://github.com/durandtibo/hya"
Repository = "https://github.com/durandtibo/hya"
Documentation = "https://durandtibo.github.io/hya/"
Changelog = "https://github.com/durandtibo/hya/releases"
Issues = "https://github.com/durandtibo/hya/issues"

[tool.uv.pip]
torch-backend = "auto"

[tool.codespell]
skip = "*.lock,./.git,./htmlcov,./docs/site,coverage.xml"
ignore-words-list = "intoto"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["hya"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
  "\\)( -> .+)?: \\.\\.\\.$",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/"]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
addopts = [
  "--color",
  "yes",
  "--durations",
  "10",
  "-rf",
  "--strict-markers",
  "--strict-config",
]
xfail_strict = true
timeout = 300
filterwarnings = [
  "error",
  # torch 2.4 and later warn at import if NumPy is not installed, which is a supported setup.
  "ignore:Failed to initialize NumPy:UserWarning",
]
# Configuration of the short test summary info
# https://docs.pytest.org/en/stable/usage.html#detailed-summary-report

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72
syntax = "google"

[tool.ruff]
# List of rules: https://docs.astral.sh/ruff/rules/
lint.select = [
  "A",    # builtins
  "ANN",  # annotations
  "ARG",  # flake8-unused-arguments
  "B",    # bugbear
  "BLE",  # flake8-blind-except
  "C4",   # flake8-comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle (Error)
  "EM",   # flake8-errmsg
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "INP",  # flake8-no-pep420
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # logging
  "N",    # naming
  "NPY",  # NumPy-specific rules
  "PD",   # pandas-vet
  "PERF", # Perflint
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",   # Pylint
  "PT",   # flake8-pytest-style
  "PTH",  # pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "TC",   # flake8-type-checking
  "TD",   # flake8-todos
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle (Warning)
]
lint.ignore = [
  "A003",    # Class attribute `{name}` is shadowing a python builtin
  "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed.
  "E501",    # Line lengths are recommended to be no greater than 79 characters.
  "W505",    # Doc line too long
  "PLR0913", # Too many arguments in function definition (8 > 5)
  "PLR2004", # Magic value used in comparison, consider replacing 0.0 with a constant variable

  # The following rules are ignored because they conflict with another library like docformatter.
  "D102", # Missing docstring in public method
  "D105", # Missing docstring in magic method
  "D107", # Missing docstring in `__init__`
  "D205", # 1 blank line required between summary line and description
  "D209", # Multi-line docstring closing quotes should be on a separate line
]

# Enable on top of the Google convention.
lint.extend-select = ["D400", "D401", "D404"]

line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = [
  "D",    # pydocstyle
  "S101", # flake8-bandit: assert
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.isort]
force-sort-within-sections = false
combine-as-imports = true
known-first-party = ["hya"]

[tool.ruff.lint.flake8-import-conventions]
[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ty.src]
include = ["src", "tests", "dev"]

[tool.ty.environment]
python-version = "3.11"

[tool.importlinter]
root_package = "hya"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Core modules must not import feature modules"
type = "forbidden"
source_modules = ["hya.imports", "hya.registry", "hya.utils"]
forbidden_modules = [
  "hya.braceexpand",
  "hya.default",
  "hya.numpy",
  "hya.resolvers",
  "hya.testing",
  "hya.torch",
]

[[tool.importlinter.contracts]]
name = "Utils must not import other modules"
type = "forbidden"
source_modules = ["hya.utils"]
forbidden_modules = [
  "hya.braceexpand",
  "hya.default",
  "hya.imports",
  "hya.numpy",
  "hya.registry",
  "hya.resolvers",
  "hya.testing",
  "hya.torch",
]

[[tool.importlinter.contracts]]
name = "Library code must not import the testing helpers"
type = "forbidden"
source_modules = [
  "hya.braceexpand",
  "hya.default",
  "hya.imports",
  "hya.numpy",
  "hya.registry",
  "hya.resolvers",
  "hya.torch",
  "hya.utils",
]
forbidden_modules = ["hya.testing"]

[[tool.importlinter.contracts]]
name = "The default registry must import the optional modules lazily"
type = "forbidden"
source_modules = ["hya.default"]
forbidden_modules = ["hya.braceexpand", "hya.numpy", "hya.torch"]

[[tool.importlinter.contracts]]
name = "Optional modules must be independent"
type = "independence"
modules = ["hya.braceexpand", "hya.numpy", "hya.torch"]
