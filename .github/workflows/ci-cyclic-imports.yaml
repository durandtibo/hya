# Cyclic imports check.
# Imports every hya subpackage in isolation to catch circular-import
# regressions that only surface once a submodule is imported directly.

name: Cyclic Imports
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  cyclic-import:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2

      - name: check modules
        run: |
          inv imports.check-cycles
