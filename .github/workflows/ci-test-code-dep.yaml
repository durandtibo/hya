# Reusable workflow for testing code with specific dependency versions.
# Used by ci-test-deps.yaml to test compatibility with different versions of dependencies.
# Runs unit tests with each specified version of a package.

name: Test Code with Dependency Version
on:
  workflow_call:
    inputs:
      package-name:
        type: string
        required: true
      package-versions:
        type: string
        required: true
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10 # free-threaded cells are slow
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # Test across all supported Python versions
        python-version: ${{ fromJson(inputs.test-matrix).python_versions }}
        # Test with each version of the specified package
        package-version: ${{ fromJson(inputs.package-versions) }}

    steps:
      # Install specific version of dependency for compatibility testing
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@4445098aa662d3d72aa0455918bc46a091b2a7f8 # ratchet:durandtibo/setup-venv-uv-action@v0.3.1
        with:
          package-name: ${{ inputs.package-name }}
          package-version: ${{ matrix.package-version }}
          python-version: ${{ matrix.python-version }}
          install-args: "--no-optional-deps"
          package-install-args: "--upgrade"

      # Run unit tests to verify compatibility
      - name: Run unit tests
        run: |
          inv test.unit
