# Type checking workflow.
# Validates type annotations using ty and pyright to ensure type safety.
# Also checks with pyright --verifytypes that the public API of the package is fully typed.
# Helps catch type-related bugs before runtime.

name: Type Checking
on:
  workflow_call:
  workflow_dispatch: # to trigger manually

permissions: {}

jobs:
  type-checking:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup python environment
        uses: durandtibo/setup-venv-uv-action@6142e28631bebf642f8ff7087c8c8702f5d99c63 # ratchet:durandtibo/setup-venv-uv-action@v0.3.2
        with:
          install-args: "--groups dev,docs"

      # Type-check the source code and the tests with ty and pyright
      - name: Check types
        run: |
          inv types.check --complete

      # The public API must be fully typed (score of 100 %). pyright finds the installed package only
      # with an activated environment, so VIRTUAL_ENV is set from the python of the environment.
      - name: Verify the types of the public API
        run: |
          VIRTUAL_ENV="$(dirname "$(dirname "$(command -v python)")")" pyright --verifytypes hya --ignoreexternal
